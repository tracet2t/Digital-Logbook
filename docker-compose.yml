version: "3.8"

services:
  postgres:
    container_name: pgdb_logbook
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: test,postgres
    ports:
      - "5432:5432"
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    networks:
      - mynetwork
    depends_on:
      - postgres

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    networks:
      - mynetwork

  nextjs-app:
    container_name: nextjs-app
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_POSTGRES_HOST: pgdb
      NEXT_PUBLIC_POSTGRES_USER: postgres
      NEXT_PUBLIC_POSTGRES_PASSWORD: postgres
      NEXT_PUBLIC_REDIS_HOST: redis
      NEXT_PUBLIC_REDIS_PORT: 6379
      DATABASE_URL: "postgresql://postgres:postgres@pgdb:5432/postgres?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mynetwork
    dns:
      - 8.8.8.8 # Google's public DNS
      - 1.1.1.1 # Cloudflare's public DNS

volumes:
  postgres:
    driver: local

networks:
  mynetwork:
    driver: bridge
